apiVersion: 1

datasources:
  - uid: soc-opensearch
    name: soc-events
    type: grafana-opensearch-datasource
    access: proxy
    url: http://opensearch-node:9200
    isDefault: true
    editable: true
    jsonData:
      database: soc-events
      timeField: timestamp
      version: 2.19.1
      flavor: opensearch
      pplEnabled: true
      logMessageField: content
      logLevelField: type
